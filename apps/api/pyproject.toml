[project]
name = "stylecut-api"
version = "0.1.0"
description = "StyleCut API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery>=5.4,<6",
    "redis>=5.2",
    "boto3>=1.35",
    "sse-starlette>=2.1",
    "yt-dlp>=2025.1.15",
    "numpy>=2.0",
    "opencv-python-headless>=4.10,<5",  # 5.0 wheels SIGILL on linux/arm64 under Docker Desktop
    "scenedetect>=0.6.5",
    "librosa>=0.10.2",
    "pyloudnorm>=0.1.1",
    "soundfile>=0.12",
    "faster-whisper>=1.1",
    # Whisper's voice-activity detector. 1.31 dies with SIGILL on linux/arm64 under Docker
    # Desktop (same SVE misdetection as OpenCV 5); 1.22 is the newest release verified to run.
    "onnxruntime>=1.20,<1.23",
    "anthropic>=1.0",
    "jinja2>=3.1",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false
# Same OpenCV pin for any transitive requirement on the non-headless build.
constraint-dependencies = ["opencv-python<5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # parametrize tables read better on one line

[tool.mypy]
python_version = "3.12"
strict = true
files = ["stylecut", "scripts"]
plugins = ["pydantic.mypy"]
# Celery ships no types, so its Task base class and decorators are Any.
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "celery.*", "kombu.*", "boto3.*", "botocore.*", "yt_dlp.*",
    "scenedetect.*", "librosa.*", "pyloudnorm.*", "soundfile.*", "faster_whisper.*",
    "reportlab.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# librosa loads its submodules lazily, which mypy cannot see.
module = ["stylecut.analysis.audio"]
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
