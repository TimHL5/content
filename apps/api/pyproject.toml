[project]
name = "stylecut-api"
version = "0.1.0"
description = "StyleCut API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery>=5.4,<6",
    "redis>=5.2",
    "boto3>=1.35",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults

[tool.mypy]
python_version = "3.12"
strict = true
files = ["stylecut", "scripts"]
plugins = ["pydantic.mypy"]
# Celery ships no types, so its Task base class and decorators are Any.
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
