name: stylecut

x-backend: &backend
  build:
    context: apps/api
  image: stylecut-api
  env_file: .env
  working_dir: /repo/apps/api
  volumes:
    - .:/repo
    - model_cache:/root/.cache/huggingface
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    storage-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stylecut
      POSTGRES_PASSWORD: stylecut
      POSTGRES_DB: stylecut
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylecut -d stylecut"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # MinIO's own images left Docker Hub in 2025; Chainguard publishes current builds.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    user: "0:0" # local dev only: lets MinIO write to the named volume
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # One-shot: waits for MinIO, creates the bucket. The 24h lifecycle rule for
  # references/ is added here in Phase 1.
  storage-init:
    build:
      context: apps/api
    image: stylecut-api
    env_file: .env
    working_dir: /repo/apps/api
    volumes:
      - .:/repo
    depends_on:
      - minio
    command: python -m scripts.bootstrap_storage

  api:
    <<: *backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn stylecut.api.app:app --host 0.0.0.0 --port 8000 --reload --reload-dir stylecut"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # All four queues in one process locally; split per queue (and put gpu on GPU hosts) in production.
  worker:
    <<: *backend
    command: >
      watchfiles --filter python
      "celery -A stylecut.jobs.celery_app worker -Q io,cpu,gpu,llm --loglevel info --concurrency 2"
      stylecut

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: stylecut-web
    env_file: .env
    working_dir: /repo
    command: pnpm --filter web dev
    ports:
      - "3000:3000"
    volumes:
      - .:/repo
      # Linux node_modules stay in volumes so they never mix with the host's.
      - web_root_modules:/repo/node_modules
      - web_app_modules:/repo/apps/web/node_modules
      - web_schemas_modules:/repo/packages/schemas/node_modules
      - web_next_cache:/repo/apps/web/.next

volumes:
  pgdata:
  model_cache:
  miniodata:
  web_root_modules:
  web_app_modules:
  web_schemas_modules:
  web_next_cache:
